server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (defense in depth alongside the API's helmet()).
    # NOTE: nginx does not inherit add_header from a parent block into a
    # location that defines its own add_header -- so these are repeated in
    # the static-assets block below rather than relying on inheritance.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Reverse proxy API calls to the backend container. axios.js uses
    # baseURL: '/api', and without this block those requests would just hit
    # the SPA fallback below and get back index.html instead of a real API
    # response. 'backend-svc' matches the network alias set in
    # docker-compose.yaml. Upgrade/Connection headers kept from the original
    # config in case any endpoint ever needs websocket support.
    location /api/ {
        proxy_pass http://backend-svc:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Serve static assets directly with long cache, no access log noise.
    # try_files ... =404 means a missing hashed asset 404s here instead of
    # falling through to index.html, which would otherwise mask the error.
    location ~* \.(?:js|css|json|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # React Router uses client-side routing -- unknown paths must fall back
    # to index.html instead of returning nginx's 404.
    location / {
        try_files $uri /index.html;
    }
}
