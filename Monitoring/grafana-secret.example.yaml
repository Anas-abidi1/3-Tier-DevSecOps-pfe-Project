# grafana-secret.example.yaml
#
# Template only -- create the real secret out-of-band, same pattern as
# k8s-prod/mysql-secret.example.yaml and backend-secret.example.yaml.
# Must exist in the `monitoring` namespace BEFORE running `helm upgrade
# --install monitoring ...`, since values.yaml references it by name.
#
#   kubectl create namespace monitoring
#   kubectl create secret generic grafana-admin-secret -n monitoring \
#     --from-literal=admin-user=admin \
#     --from-literal=admin-password="$(openssl rand -base64 24)"
#
# Shape values.yaml expects (grafana.admin.existingSecret):
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: grafana-admin-secret
#   namespace: monitoring
# type: Opaque
# stringData:
#   admin-user: admin
#   admin-password: REPLACE_ME
