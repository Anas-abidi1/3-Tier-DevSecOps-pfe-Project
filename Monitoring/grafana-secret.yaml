# LAB/PRACTICE VALUES -- see grafana-secret.example.yaml for the general
# pattern. Apply with: kubectl apply -f Monitoring/grafana-secret.yaml
# (must exist in the monitoring namespace before `helm upgrade --install`)
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-secret
  namespace: monitoring
type: Opaque
stringData:
  admin-user: admin
  admin-password: admin123
