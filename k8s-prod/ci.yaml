---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    # Replaced a real personal Gmail address with a placeholder -- use a
    # team/role address you control (e.g. devops@yourdomain.com) rather than
    # a personal one, since this file is likely to end up in version control.
    email: YOUR_TEAM_EMAIL@example.com
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          ingress:
            class: nginx
