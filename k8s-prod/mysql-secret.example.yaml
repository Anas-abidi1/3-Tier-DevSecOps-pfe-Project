# mysql-secret.example.yaml
#
# This is a TEMPLATE, not something to apply as-is or commit with real
# values filled in. Two ways to actually create this secret in your cluster:
#
# Option A -- imperative kubectl command (simplest, nothing touches disk):
#
#   kubectl create secret generic mysql-secret -n prod \
#     --from-literal=MYSQL_ROOT_PASSWORD='<strong-unique-password>' \
#     --from-literal=MYSQL_USER=crud_app_user \
#     --from-literal=MYSQL_PASSWORD='<a-different-strong-password>'
#
# Option B -- from a Jenkins credential in the CI/CD pipeline, e.g.:
#
#   withCredentials([usernamePassword(credentialsId: 'mysql-app-creds',
#                                      usernameVariable: 'DB_USER',
#                                      passwordVariable: 'DB_PASS')]) {
#     sh '''
#       kubectl create secret generic mysql-secret -n prod \
#         --from-literal=MYSQL_ROOT_PASSWORD="$ROOT_PASS" \
#         --from-literal=MYSQL_USER="$DB_USER" \
#         --from-literal=MYSQL_PASSWORD="$DB_PASS" \
#         --dry-run=client -o yaml | kubectl apply -f -
#     '''
#   }
#
# Either way, the real secret never lives in a file that gets committed.
#
# For reference, this is the shape mysql.yaml and backend.yaml expect:
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: mysql-secret
#   namespace: prod
# type: Opaque
# stringData:
#   MYSQL_ROOT_PASSWORD: REPLACE_ME
#   MYSQL_USER: crud_app_user
#   MYSQL_PASSWORD: REPLACE_ME
